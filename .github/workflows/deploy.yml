
name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 17 Nov 2026: persiajs.dev redirects to fa.gazar.dev until the domain lapses (1 May 2027).
      # The Astro site stays in the repo; to restore it, bring back the
      # Node setup, npm ci and npm run build steps and upload ./dist.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
